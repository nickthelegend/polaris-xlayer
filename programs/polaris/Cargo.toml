[package]
name = "polaris"
version = "0.1.0"
description = "Polaris — undercollateralized BNPL, subscriptions and payments on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "polaris"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# anchor-spl's default features stay on: Anchor's `token::mint = ...` init
# constraints generate code against the unified token interface, so dropping
# token_2022 does not compile even for a program that only ever touches classic
# SPL mints.
anchor-spl = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
